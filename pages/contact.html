<body>
  <div class="loader">
    <span></span>

      <text x="50%" y="50%" dy=".32em" text-anchor="middle">H E A L T H F I T</text>
    </svg>

  <main id="root">
    <header class="navigation">

    <section class="flex" id="up">
      <form action="">
        <h2 class="form-title">Get in Touch 💬</h2>

        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your Name" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your Email" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone:</label>
          <input type="number" id="phone" name="phone" placeholder="Enter your Mobile No." max="9999999999" />
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" placeholder="Enter your Feedback / Message" required></textarea>
        </div>
        <div class="form-group">
          <input type="submit" value="Submit" />
        </div>
      </form>

      <div class="image">
        <img src="../assets/imgs/contact.png" alt="contact" />
      </div>
    </section>

    <footer>

        <h1><a href="../index.html">HealthFit</a></h1>
